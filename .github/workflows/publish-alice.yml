name: Publish Alice user release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alice-user-release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and publish the user installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: python3 .release/publish_release.py
